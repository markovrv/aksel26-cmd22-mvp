services:
  db:
    image: postgres:17-alpine
    container_name: qualify-dev-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qualify}
      POSTGRES_USER: ${POSTGRES_USER:-qualify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qualify}
    ports:
      - "5432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
      - ./create.sql:/docker-entrypoint-initdb.d/01-create.sql:ro
      - ./insert.sql:/docker-entrypoint-initdb.d/02-insert.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qualify} -d ${POSTGRES_DB:-qualify}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: qualify-dev-backend
    environment:
      DB_NAME: ${POSTGRES_DB:-qualify}
      DB_USER: ${POSTGRES_USER:-qualify}
      DB_PASS: ${POSTGRES_PASSWORD:-qualify}
      DB_HOST: db
      DB_PORT: 5432
      DB_SEED_PATH: /seed/insert.sql
      PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "8000:8000"
    volumes:
      - ./back:/app
      - ./insert.sql:/seed/insert.sql:ro
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload --reload-delay 0.75

  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: qualify-dev-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./front:/app
      - frontend-dev-node-modules:/app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres-dev-data:
  frontend-dev-node-modules:
